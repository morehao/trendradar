openapi: 3.1.0
info:
  title: trendradar serve API
  version: 1.0.0
  description: |
    Read-only HTTP surface exposed by `trendradar serve`. All payloads reuse the
    digest.v1 schema, so the plugin can consume the same shape whether data comes
    from the filesystem or over HTTP.
servers:
  - url: http://127.0.0.1:8787
paths:
  /api/v1/digests/{date}:
    get:
      operationId: getDigest
      summary: Fetch one day's digest
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The digest document
          content:
            application/json:
              schema:
                $ref: "./digest.v1.json"
        "404":
          description: No digest for that date
  /api/v1/manifest:
    get:
      operationId: getManifest
      summary: List available dates and their contentHash
      responses:
        "200":
          description: Manifest of available digests
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  coreVersion:
                    type: string
                  entries:
                    type: array
                    items:
                      type: object
                      required: [date, contentHash]
                      properties:
                        date:
                          type: string
                          format: date
                        contentHash:
                          type: string
                        degraded:
                          type: boolean
  /feed.xml:
    get:
      operationId: getFeed
      summary: RSS feed of the most recent digests
      responses:
        "200":
          description: RSS 2.0 feed
          content:
            application/rss+xml:
              schema:
                type: string
