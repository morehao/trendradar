# trendradar 配置示例：复制为 config.yaml 后按需修改。
# 密钥不要写进本文件；用 ${VAR} 引用 .env / 环境变量（见 .env.example）。
model:
  provider: deepseek
  name: deepseek-flash             # = DeepSeek-V4.1-Flash；也可写 ${DEEPSEEK_MODEL}
  baseURL: https://api.deepseek.com/v1  # 也可写 ${DEEPSEEK_BASE_URL}
  apiKey: ${DEEPSEEK_API_KEY}
  # 本地离线自测可把 provider 设为 fake（无需密钥）。

repo:
  path: /path/to/data-repo          # 写入 digest 的目标仓库工作区
  remote: origin
  baseBranch: main
  authorName: trendradar
  authorEmail: trendradar@example.com

pr:
  enabled: true
  autoMerge: false

trending:
  languages: [all, go, python, rust, typescript]
  since: daily

output:
  dir: digests
  branchPrefix: trending/
  retentionDays: 90
  # per-period（默认）：<branchPrefix><period>/<name>，每个周期一条分支
  # per-date：<branchPrefix><date>，同一天的多周期追加到同一条分支，只开一个 PR
  branchGrouping: per-period

schedule:
  cron: "0 8 * * *"                 # 仅供 serve 模式参考

# 摘要与可选外部上下文（Track B）
summarize:
  batchSize: 10
  maxRetries: 1

  # none（默认，仅元数据）| repo（+GitHub topics）| readme（+800 字 README 摘录）
  # 建议：有 GITHUB_READ_TOKEN 的定时任务先开 repo；readme 需先 eval 复测再开。
  enrich: repo

  readmeChars: 800
  enrichCacheTTLHours: 168
  enrichConcurrency: 4
  enrichTimeoutSeconds: 5
  enrichBudgetSeconds: 8            # readme 模式建议 12

# 开启 enrich=repo/readme 时，建议在 .env 配一个独立只读 token：
#   GITHUB_READ_TOKEN=ghp_xxx
# 未配则按未认证访问；readme 模式在慢网络下可能因预算耗尽而跳过部分仓库（自动降级，不影响 run）。

# 仓库发版订阅（可选）。订阅列表由 `trendradar subscribe` 维护在独立文件里，
# 不写在本文件；这里只放全局行为参数。enabled=false 时 releases 阶段完全旁路。
releases:
  enabled: false
  subscriptionsFile: subscriptions.yaml   # 相对 config 文件目录；也可 --file 覆盖
  includePrerelease: false
  includeDrafts: false
  fallbackToTags: true                   # 无 Release 时回退 Tag
  baselineOnFirstRun: true               # 首次只记基线，不补发历史
  backfillLatest: 0                      # 首次补发最近 N 个（0=不补）
  perRepoLimit: 10                       # 文档里每仓每周最多列出的版本数，其余写「其余 N 个」
  maxNotesChars: 4000                    # 一次总结可用的 notes 总预算（按版本均分）
  summaryMaxChars: 1200                  # 每仓每周一段总结的字符上限（500-2000）
  docMaxLines: 600                       # 每仓文档行数阈值，超过后下一次写入开 -02.md
  concurrency: auto                      # auto=clamp(4, ceil(N/10), 8)；也可写 1-8
  timeoutSeconds: 20
  budgetSeconds: auto                    # auto=min(300, 30+3N)；也可写 1-300
  maxPages: 10                           # 单仓库翻页上限（兜底 300 条历史）
  outputDir: releases                    # 产物在 <output.dir>/releases/
  period: weekly                         # 总结周期，本版只支持 weekly
  timezone: Asia/Shanghai                # ISO 周边界按该时区计算
  weekStart: monday                      # 仅支持 monday（ISO 8601）
