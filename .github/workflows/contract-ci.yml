name: contract-ci

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci.yml"
  pull_request:
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: contract

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contract/package-lock.json
      - run: npm ci
      - name: version carriers consistent + breaking-change gate
        run: npm run verify-versions
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: v1 -> v2 field map complete
        run: npm run verify-field-map
      - run: npm test
      - run: npm pack --dry-run

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: contract/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contract/package-lock.json
      - run: npm ci
      - name: generated code is up to date (deterministic, gofmt'd)
        run: |
          npm run generate
          git diff --exit-code -- gen contract.gen.go schema
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
