name: contract-ci

# 镜像显式钉 ubuntu-24.04：ubuntu-latest 自 2026-10-19 起分批迁到 26.04（11-19 完成），
# 校验结果不该随镜像漂移；要试新镜像就单独改 ubuntu-26.04 跑一轮。
on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci.yml"
  pull_request:
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci.yml"

# 同一 workflow + ref 串行化：同分支最多一个运行 + 一个等待，新提交会顶掉旧的等待，省 runner。
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

defaults:
  run:
    working-directory: contract

jobs:
  ts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contract/package-lock.json
      - run: npm ci
      - name: version carriers consistent + breaking-change gate
        run: npm run verify-versions
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: v1 -> v2 field map complete
        run: npm run verify-field-map
      - run: npm test
      - run: npm pack --dry-run

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"
          cache-dependency-path: contract/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contract/package-lock.json
      - run: npm ci
      - name: generated code is up to date (deterministic, gofmt'd)
        run: |
          npm run generate
          git diff --exit-code -- gen contract.gen.go schema
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
