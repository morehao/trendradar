name: release

# 镜像显式钉 ubuntu-24.04：ubuntu-latest 自 2026-10-19 起分批迁到 26.04（11-19 完成），
# 发布失败只能补发（tag 已推不可改），更不该跟 latest 漂；要试新镜像就手动改 ubuntu-26.04。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 发布是 tag 触发：同 tag 重复触发时串行化，避免并发发布（发布本身幂等，已在跑的不会被杀）。
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"
          cache: true
      - name: regenerate contract hash
        run: go run ./tools/contracthash -contract contract/legacy-v1
      - name: verify contract hash is committed
        run: git diff --exit-code contract/legacy-v1/CONTRACT.sha256
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
